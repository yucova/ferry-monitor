name: Ferry Seat Monitor

on:
  schedule:
    # 9月14〜22日（UTC）の5分おき。期間外は動きません
    - cron: '*/5 * 14-22 9 *'
  workflow_dispatch:
    inputs:
      test_notify:
        description: '通知テストだけ行う（サイトは見ない）'
        type: boolean
        default: false

# 前の回が終わる前に次が始まらないようにする（状態ファイルの取り合い防止）
concurrency:
  group: ferry-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Chrome と npm のダウンロードを使い回して1回あたりを短くする
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/puppeteer
          key: deps-${{ runner.os }}-${{ hashFiles('package.json') }}

      # 「前回どこが空いていたか」を引き継ぐ（同じ空席で何度も通知しないため）
      - name: Restore last state
        uses: actions/cache@v4
        with:
          path: state
          key: ferry-state-${{ github.run_id }}
          restore-keys: |
            ferry-state-

      - run: npm install

      - name: Run monitor script
        env:
          SLACK_WEBHOOK_URL:         ${{ secrets.SLACK_WEBHOOK_URL }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:              ${{ secrets.LINE_USER_ID }}
          TEST_NOTIFY:               ${{ inputs.test_notify }}
        run: node index.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
